<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日本隨行小卡</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #FFFDF2;
      --card-bg: #FFFFFF;
      --primary-yellow: #FFE066;
      --soft-yellow: #FFF2B2;
      --soft-pink: #FFD1DC;
      --accent-orange: #FF9B42;
      --text-color: #5A4A42;
      --light-text: #9E8E85;
      --border-color: #F7E7C4;
      --shadow: 0 10px 25px rgba(230, 190, 100, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Zen Maru Gothic', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px 14px 30px 14px;
      background-image: radial-gradient(var(--border-color) 1.5px, transparent 1.5px);
      background-size: 18px 18px;
      position: relative;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
      width: 100%;
      max-width: 360px;
      position: relative;
    }

    header h1 {
      font-size: 1.55rem;
      font-weight: 900;
      color: var(--text-color);
      margin-bottom: 6px;
    }

    .menu-btn {
      position: absolute;
      right: 0;
      top: 0;
      background: var(--soft-pink);
      color: #D85A75;
      border: 2px solid #FFB7B2;
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 0.8rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(255, 209, 220, 0.5);
    }

    /* 側邊抽屜遮罩 */
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(90, 74, 66, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 99;
    }

    .drawer-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* 側邊抽屜容器 */
    .drawer-menu {
      position: fixed;
      top: 0;
      right: -320px;
      width: 300px;
      height: 100vh;
      background: var(--bg-color);
      box-shadow: -5px 0 25px rgba(0,0,0,0.15);
      transition: right 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: 100;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .drawer-menu.active {
      right: 0;
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px dashed var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .drawer-header h2 {
      font-size: 1.15rem;
      color: var(--accent-orange);
      font-weight: 900;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.4rem;
      color: var(--text-color);
      cursor: pointer;
    }

    .back-menu-btn {
      background: var(--bg-color);
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      padding: 4px 10px;
      font-size: 0.8rem;
      font-weight: 900;
      color: var(--text-color);
      cursor: pointer;
      margin-bottom: 12px;
      display: inline-block;
      width: fit-content;
    }

    .drawer-nav-btn {
      width: 100%;
      background: #FFF;
      border: 2.5px solid var(--border-color);
      border-radius: 16px;
      padding: 16px 14px;
      margin-bottom: 12px;
      font-size: 1rem;
      font-weight: 900;
      color: var(--text-color);
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 10px rgba(230, 190, 100, 0.15);
      transition: transform 0.15s;
    }

    .drawer-nav-btn:active {
      transform: scale(0.97);
    }

    /* 航班卡片 */
    .flight-card {
      background: #FFF;
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 14px 12px;
      margin-bottom: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.04);
    }

    .flight-badge {
      display: inline-block;
      background: #EBF4FC;
      color: #5B9BD5;
      font-size: 0.75rem;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .flight-route-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .flight-airport {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--text-color);
    }

    .flight-airport small {
      display: block;
      font-size: 0.72rem;
      color: var(--light-text);
      font-weight: 700;
    }

    .flight-plane-icon {
      font-size: 1.1rem;
      color: var(--accent-orange);
    }

    .flight-detail-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--light-text);
      font-weight: 700;
      padding: 3px 0;
      border-bottom: 1px dashed #F5F1E9;
    }

    .flight-detail-item span:last-child {
      color: var(--text-color);
      font-weight: 900;
    }

    .flight-action-btn {
      display: inline-block;
      width: 100%;
      text-align: center;
      background: #9D7B54;
      color: #FFF;
      border: 1.5px solid #846543;
      padding: 8px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 900;
      text-decoration: none;
      margin-top: 8px;
      box-shadow: 0 3px 8px rgba(157, 123, 84, 0.25);
    }

    /* 緊急聯絡卡片 */
    .emergency-card {
      background: #FFF;
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .emergency-title {
      font-size: 0.9rem;
      font-weight: 900;
      color: #D85A75;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .emergency-item {
      font-size: 0.82rem;
      color: var(--text-color);
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .call-btn {
      display: inline-block;
      width: 100%;
      text-align: center;
      background: var(--soft-yellow);
      color: var(--accent-orange);
      border: 1.5px solid var(--border-color);
      padding: 6px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 900;
      text-decoration: none;
      margin-top: 4px;
    }

    /* 餐廳卡片 */
    .restaurant-card {
      background: #FFF;
      border: 2px solid var(--border-color);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .res-name {
      font-size: 0.95rem;
      font-weight: 900;
      color: var(--accent-orange);
      margin-bottom: 4px;
    }

    .res-info {
      font-size: 0.78rem;
      color: var(--light-text);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .nav-btn {
      display: inline-block;
      width: 100%;
      text-align: center;
      background: #EBF4FC;
      color: #5B9BD5;
      border: 1px solid #D0E3F7;
      padding: 5px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 900;
      text-decoration: none;
    }

    .trip-counter-badge {
      display: inline-block;
      background: var(--soft-yellow);
      color: var(--accent-orange);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 5px 16px;
      border-radius: 16px;
