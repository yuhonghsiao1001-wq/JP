<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日本隨行小卡</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #FFFDF2;
      --card-bg: #FFFFFF;
      --primary-yellow: #FFE066;
      --soft-yellow: #FFF2B2;
      --soft-pink: #FFD1DC;
      --accent-orange: #FF9B42;
      --text-color: #5A4A42;
      --light-text: #9E8E85;
      --border-color: #F7E7C4;
      --shadow: 0 10px 25px rgba(230, 190, 100, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Zen Maru Gothic', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px 14px 30px 14px;
      background-image: radial-gradient(var(--border-color) 1.5px, transparent 1.5px);
      background-size: 18px 18px;
      position: relative;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
      width: 100%;
      max-width: 360px;
      position: relative;
    }

    header h1 {
      font-size: 1.55rem;
      font-weight: 900;
      color: var(--text-color);
      margin-bottom: 6px;
    }

    .menu-btn {
      position: absolute;
      right: 0;
      top: 0;
      background: var(--soft-pink);
      color: #D85A75;
      border: 2px solid #FFB7B2;
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 0.8rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(255, 209, 220, 0.5);
    }

    /* 側邊抽屜 */
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(90, 74, 66, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 99;
    }

    .drawer-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-menu {
      position: fixed;
      top: 0;
      right: -320px;
      width: 300px;
      height: 100vh;
